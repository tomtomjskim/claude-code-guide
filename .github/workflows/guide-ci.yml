name: Claude Code Guide CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate guide and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Run regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository
        run: bash scripts/validate-repository.sh

      - name: Normalize changed Markdown whitespace for same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "docs/15-token-pricing-optimization.md",
              "docs/18-fast-mode.md",
              "docs/19-context-window-internals.md",
              "docs/plans/2026-08-13-reasoning-state-cost-hardening.md",
          ):
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY
          if git diff --quiet -- docs/15-token-pricing-optimization.md docs/18-fast-mode.md docs/19-context-window-internals.md docs/plans/2026-08-13-reasoning-state-cost-hardening.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/15-token-pricing-optimization.md docs/18-fast-mode.md docs/19-context-window-internals.md docs/plans/2026-08-13-reasoning-state-cost-hardening.md
          git commit -m "style(docs): normalize trailing whitespace"
          git push origin "HEAD:${HEAD_REF}"

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
